services:
  - type: worker
    name: telegram-bot
    env: node
    plan: free
    rootDir: src
    buildCommand: "npm install --no-audit --no-fund"
    startCommand: "npm start"
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        value: "9228974259:AAE5v1pBy4P4L7ksSqwAZOltDyY2AopATvY"
      - key: DATA_FILE
        value: "/data/data.json"
      - key: NODE_ENV
        value: "production"
    disks:
      - name: data
        mountPath: /data
        sizeGB: 1
