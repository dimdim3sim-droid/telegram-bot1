<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bot Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--tg-theme-bg-color,#1a1a2e);color:var(--tg-theme-text-color,#fff);padding:16px;min-height:100vh}
.header{text-align:center;padding:20px 0;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:20px}
.header h1{font-size:24px;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card{background:rgba(255,255,255,.05);border-radius:12px;padding:16px;margin-bottom:12px;border:1px solid rgba(255,255,255,.1)}
.card h3{margin-bottom:8px;color:#667eea}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stat{background:rgba(102,126,234,.15);border-radius:8px;padding:12px;text-align:center}
.stat .val{font-size:22px;font-weight:bold;color:#667eea}
.stat .lbl{font-size:12px;opacity:.7;margin-top:4px}
.btn{display:block;width:100%;padding:12px;border:none;border-radius:8px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.secondary{background:rgba(255,255,255,.1)}
.tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto}
.tab{padding:8px 16px;border-radius:20px;background:rgba(255,255,255,.1);cursor:pointer;white-space:nowrap;font-size:14px}
.tab.active{background:linear-gradient(135deg,#667eea,#764ba2)}
.section{display:none}.section.active{display:block}
.list-item{background:rgba(255,255,255,.05);border-radius:8px;padding:12px;margin-bottom:8px;border-left:3px solid #667eea}
.list-item .title{font-weight:600;margin-bottom:4px}
.list-item .meta{font-size:12px;opacity:.6}
.loading{text-align:center;padding:40px;opacity:.6}
.empty{text-align:center;padding:40px;opacity:.5}
</style>
</head>
<body>
<div class="header">
  <h1>🤖 Bot Dashboard</h1>
  <p id="username" style="opacity:.7;margin-top:8px"></p>
</div>

<div class="tabs">
  <div class="tab active" data-tab="home">🏠 Home</div>
  <div class="tab" data-tab="profile">👤 Profile</div>
  <div class="tab" data-tab="orders">📋 Orders</div>
  <div class="tab" data-tab="shop">🛒 Shop</div>
  <div class="tab" data-tab="fish">🎣 Fishing</div>
</div>

<div id="home" class="section active">
  <div class="stat-grid">
    <div class="stat"><div class="val" id="stars">0</div><div class="lbl">⭐ Stars</div></div>
    <div class="stat"><div class="val" id="coins">0</div><div class="lbl">🪙 Coins</div></div>
    <div class="stat"><div class="val" id="title">-</div><div class="lbl">🏷️ Title</div></div>
    <div class="stat"><div class="val" id="invited">0</div><div class="lbl">👥 Invited</div></div>
  </div>
  <div class="card">
    <h3>📊 Stats</h3>
    <p id="statsText">Loading...</p>
  </div>
  <button class="btn" onclick="tg.close()">Close</button>
</div>

<div id="profile" class="section">
  <div class="card">
    <h3>👤 My Profile</h3>
    <p id="profileText">Loading...</p>
  </div>
  <div class="card">
    <h3>🏆 Titles</h3>
    <p id="titlesText">Loading...</p>
  </div>
</div>

<div id="orders" class="section">
  <div class="card">
    <h3>📋 My Orders</h3>
    <div id="ordersList"><div class="loading">Loading...</div></div>
  </div>
</div>

<div id="shop" class="section">
  <div class="card">
    <h3>🛒 Titles Shop</h3>
    <div id="shopList"><div class="loading">Loading...</div></div>
  </div>
</div>

<div id="fish" class="section">
  <div class="card">
    <h3>🎣 Fishing Inventory</h3>
    <div id="fishList"><div class="loading">Loading...</div></div>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
tg.ready();

const userId = tg.initDataUnsafe?.user?.id;
const username = tg.initDataUnsafe?.user?.username || tg.initDataUnsafe?.user?.first_name || 'User';
document.getElementById('username').textContent = '@' + username;

// Tab switching
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.tab).classList.add('active');
  });
});

// Load data from bot via sendData or use initData
async function loadData() {
  // For now, show placeholder - real data comes via bot API
  document.getElementById('stars').textContent = '0';
  document.getElementById('coins').textContent = '0';
  document.getElementById('title').textContent = '-';
  document.getElementById('invited').textContent = '0';
  document.getElementById('statsText').textContent = 'Use bot commands for full stats';
  document.getElementById('profileText').textContent = 'Profile data loaded from bot';
  document.getElementById('titlesText').textContent = 'Buy titles in shop';
  document.getElementById('ordersList').innerHTML = '<div class="empty">No orders yet</div>';
  document.getElementById('shopList').innerHTML = '<div class="empty">Shop items load from bot</div>';
  document.getElementById('fishList').innerHTML = '<div class="empty">No fish yet</div>';
}

loadData();
</script>
</body>
</html>
